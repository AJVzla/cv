name = "cv-chat"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Sitios que pueden usar el chat. Separalos con comas.
ALLOWED_ORIGINS = "https://anthonymasyrubi.com,https://www.anthonymasyrubi.com,https://ajvzla.github.io"
# Modelo de Gemini. "gemini-flash-latest" apunta siempre al Flash vigente.
GEMINI_MODEL = "gemini-flash-latest"
# Minutos que la IA queda en pausa después de que respondés vos desde Telegram.
HUMAN_MINUTES = "30"

# Base de datos para tus respuestas desde Telegram.
# Creala con: npx wrangler d1 create cv-chat  y pegá acá el database_id que te devuelve.
[[d1_databases]]
binding = "DB"
database_name = "cv-chat"
database_id = "0080a4b4-69b0-42ea-89e4-6a0f384f4da6"

# Los secretos NO van acá. Se cargan con:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
